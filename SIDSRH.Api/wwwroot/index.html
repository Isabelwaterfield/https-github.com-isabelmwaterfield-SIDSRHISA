<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SIDSRH</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--navy:#082c60;--teal:#078d96;--bg:#e8f4fc;--card:#fff;--line:#d7e3ec}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:#122}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
#welcome{min-height:100vh;display:flex;flex-direction:column;background:#e8f4fc}
#welcome .hero{flex:1;display:flex;align-items:center;justify-content:center;padding:12px}
#welcome .hero img{width:min(1100px,100%);height:auto;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#welcome .actions{display:flex;gap:14px;justify-content:center;padding:18px 16px 28px;background:linear-gradient(180deg,#d6eef8,#e8f4fc)}
#welcome .actions button{min-width:160px;padding:14px 28px;border-radius:28px;border:2px solid var(--navy);font-weight:700;cursor:pointer;font-size:16px}
#welcome .btn-login{background:var(--navy);color:#fff}
#welcome .btn-register{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;background:#e8f4fc}
.auth-screen::before{content:"";position:absolute;left:0;right:0;top:0;bottom:0;background:url("/assets/auth-bg.jpg") center center / 105% 100% no-repeat;opacity:1;z-index:0}
.auth-screen::after{content:"";position:absolute;inset:0;background:transparent;z-index:0}
.auth-screen .auth{position:relative;z-index:1}
.auth{width:100%;max-width:400px;background:rgba(255,255,255,.92);padding:28px;border-radius:16px;box-shadow:0 12px 36px rgba(8,44,96,.2);border:1px solid rgba(255,255,255,.85);backdrop-filter:blur(2px)}
.auth h2{margin:0 0 16px;color:var(--navy)}
.auth label{display:block;margin:10px 0 4px;font-size:13px;color:#445}
.auth input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.auth .primary{width:100%;margin-top:16px;padding:12px;border:0;border-radius:10px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer}
.btn-back{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:10px 16px;border-radius:999px;border:1px solid #b8d0e4;background:#f3f9fd;color:var(--navy);font-weight:600;cursor:pointer}
.btn-back:hover{background:#e3f1fa}
.app{display:flex;min-height:100vh;align-items:stretch}
.side{width:240px;background:var(--navy);color:#fff;padding:16px 12px;flex-shrink:0;height:100vh;overflow-y:auto;position:sticky;top:0}
.side .brand{font-weight:800;font-size:20px;letter-spacing:1px;padding:8px 10px 16px}
.side button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#dce9f5;padding:10px 12px;border-radius:8px;cursor:pointer;margin-bottom:4px}
.side button:hover,.side button.active{background:rgba(255,255,255,.12);color:#fff}
.main{flex:1;display:flex;flex-direction:column}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;justify-content:space-between;align-items:center}
.top strong{color:var(--navy)}
.content{padding:18px;flex:1}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card .n{font-size:26px;font-weight:800;color:var(--navy)}
.card .l{font-size:12px;color:#667}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.panel h3{margin:0 0 12px;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
th{font-size:12px;color:#556;background:#f7fafc}
.btn{padding:8px 12px;border-radius:8px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer;margin:2px}
.btn.ghost{background:#fff;color:var(--navy)}
.btn.small{padding:5px 8px;font-size:12px}
.btn.ok{background:#0a7a45;border-color:#0a7a45}
.msg{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:13px}
.msg.ok{background:#e7f7ee;color:#0a5}
.msg.err{background:#fdecea;color:#8a1c1c}
#map{height:420px;border-radius:12px;border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
.row > *{flex:1;min-width:140px}
label.f{font-size:12px;color:#556;display:block;margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;background:#e8eef5}
.pick{border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0;cursor:pointer;background:#fafcfe}
.pick:hover,.pick.selected{border-color:var(--teal);background:#eefafb}
.pick .meta{font-size:12px;color:#556}
@media(max-width:800px){.app{flex-direction:column}.side{width:100%}}
</style>
</head>
<body>
<div id="welcome">
  <div class="hero"><img src="/assets/welcome-banner.jpg" alt="SIDSRH"/></div>
  <div class="actions">
    <button class="btn-login" id="goLogin">Login</button>
    <button class="btn-register" id="goRegister">Register</button>
    <button class="btn-register" id="goExternal" style="border-color:#0d6efd;color:#0d6efd">External registration</button>
  </div>
</div>
<div id="loginPage" class="auth-screen hidden">
  <div class="auth">
    <h2>Sign in</h2>
    <div id="loginMsg"></div>
    <label>Email</label><input id="loginEmail" type="email" autocomplete="username"/>
    <label>Password</label><input id="loginPass" type="password" autocomplete="current-password"/>
    <label id="otpLabel" class="hidden">MFA / OTP code</label><input id="loginOtp" class="hidden" autocomplete="one-time-code"/>
    <button class="primary" id="btnLogin">Sign in</button>
    <div style="display:flex;gap:10px;justify-content:space-between;margin-top:12px;flex-wrap:wrap">
      <button type="button" class="btn-back" id="goRegisterFromLogin" style="margin:0">Register</button>
      <button type="button" class="btn-back" id="goForgot" style="margin:0">Forgot password</button>
    </div>
    <button type="button" class="btn-back" id="backWelcome1">Back to welcome</button>
  </div>
</div>
<div id="registerPage" class="auth-screen hidden">
  <div class="auth">
    <h2>Create patient account</h2>
    <p style="font-size:13px;color:#556;margin-top:0">Clinic staff accounts are issued by an administrator.</p>
    <div id="regMsg"></div>
    <label>First name</label><input id="regFirst"/>
    <label>Last name</label><input id="regLast"/>
    <label>Email</label><input id="regEmail" type="email"/>
    <label>Password</label><input id="regPass" type="password"/>
    <button class="primary" id="btnRegister">Create account</button>
    <button type="button" class="btn-back" id="backWelcome2">Back to welcome</button>
  </div>
</div>

<div id="externalPage" class="auth-screen hidden">
  <div class="auth" style="max-width:440px">
    <h2>External registration</h2>
    <p style="font-size:13px;color:#555;margin:0 0 12px">For community members who need delivery services. Details are checked against the clinic patient list. Appointment staff (Nelly) will verify submissions.</p>
    <div id="extMsg"></div>
    <label>First name</label><input id="extFirst" required/>
    <label>Surname</label><input id="extLast" required/>
    <label>ID number</label><input id="extId"/>
    <label>Phone</label><input id="extPhone"/>
    <label>Email</label><input id="extEmail" type="email"/>
    <label>Address</label><input id="extAddr"/>
    <label>Preferred call day (Mon–Fri)</label>
    <select id="extDay">
      <option value="">Select day</option>
      <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
      <option>Thursday</option><option>Friday</option>
    </select>
    <label>Preferred call time (08:30–17:00)</label>
    <input id="extTime" type="time" min="08:30" max="17:00" value="09:00"/>
    <button class="primary" id="btnExternal">Submit registration</button>
    <button type="button" class="btn-back" id="backWelcomeExt">Back to welcome</button>
  </div>
</div>
<div id="forgotPage" class="auth-screen hidden">
  <div class="auth">
    <h2>Reset password</h2>
    <div id="forgotMsg"></div>
    <label>Email</label><input id="forgotEmail" type="email"/>
    <button class="primary" id="btnForgot">Send OTP code</button>
    <label>OTP code</label><input id="forgotOtp"/>
    <label>New password</label><input id="forgotNew" type="password"/>
    <button class="primary" id="btnReset">Update password</button>
    <button type="button" class="btn-back" id="backLoginFromForgot">Back to sign in</button>
  </div>
</div>
<div id="app" class="app hidden">
  <aside class="side">
    <div class="brand"><img src="/assets/sidsrh-logo.png" alt="" style="height:36px;vertical-align:middle;margin-right:8px;border-radius:6px">SIDSRH</div>
    <nav id="sideNav"></nav>
    <button id="btnLogout" style="margin-top:20px">Logout</button>
  </aside>
  <div class="main">
    <div class="top"><div><strong id="dashTitle">Dashboard</strong></div><div id="userChip"></div></div>
    <div class="content" id="content"></div>
  </div>
</div>
<script>
const API="";
let token=localStorage.getItem("sidsrh_token")||"";
let user=JSON.parse(localStorage.getItem("sidsrh_user")||"null");
let mapInst=null;
const MENUS={
"Administrator":[["dashboard","Dashboard"],["map","Live Map"],["drones","Drones"],["deliveries","Deliveries"],["requests","Patient Requests"],["patients","Patients"],["locations","Locations"],["extqueue","External queue (Nelly)"],["schedules","Chronic schedules"],["appointments","Appointments"],["dispense","Clinic Dispense"],["supplies","Supplies"],["staff","Staff"],["clinics","Clinics"],["stations","Charge stations"],["weather","Weather"],["equipment","Equipment"],["activity","Recent activity"],["users","Users"],["reports","Reports"],["backup","Backup"]],
"Manager":[["dashboard","Dashboard"],["deliveries","Deliveries"],["patients","Patients"],["locations","Locations"],["extqueue","External queue (Nelly)"],["staff","Staff"],["appointments","Appointments"],["weather","Weather"],["reports","Reports"],["activity","Recent activity"]],
"Appointment Clerk":[["dashboard","Dashboard"],["extqueue","Verify registrations"],["patients","Patients"],["appointments","Appointments"],["activity","Recent activity"]],
"Supply Coordinator":[["dashboard","Dashboard"],["supplies","Supplies"],["deliveries","Deliveries"],["dispense","Dispense"],["activity","Recent activity"],["reports","Reports"]],
"Emergency Coordinator":[["dashboard","Dashboard"],["requests","Patient Requests"],["deliveries","Deliveries"],["map","Live Map"],["activity","Recent activity"],["reports","Reports"]],
"Healthcare Staff":[["dashboard","Dashboard"],["deliveries","Deliveries"],["patients","Patients"],["locations","Locations"],["schedules","Chronic schedules"],["dispense","Dispense"],["supplies","Supplies"],["equipment","Equipment"],["activity","Recent activity"]],
"Technician":[["dashboard","Dashboard"],["drones","Drones"],["equipment","Equipment"],["activity","Recent activity"],["reports","Reports"]],
"Patient":[["dashboard","Dashboard"],["requests","My Requests"],["deliveries","Track delivery"],["myreceipt","My delivery receipt"],["appointments","Checkup appointments"]]
};
function show(id){["welcome","loginPage","registerPage","externalPage","forgotPage","app"].forEach(x=>{const el=document.getElementById(x);if(el)el.classList.add("hidden");});const t=document.getElementById(id);if(t)t.classList.remove("hidden");}
function authHeaders(){return token?{"Authorization":"Bearer "+token,"Content-Type":"application/json"}:{"Content-Type":"application/json"};}
async function api(path,opts={}){const headers={...authHeaders(),...(opts.headers||{})};if(opts.body&&!headers["Content-Type"])headers["Content-Type"]="application/json";const r=await fetch(API+path,{...opts,headers});const text=await r.text();let data=null;try{data=text?JSON.parse(text):null;}catch{data=text;}if(!r.ok){const err=new Error((data&&data.message)||r.statusText||"Request failed");err.body=data;throw err;}return data;}
function msg(el,text,type="info"){if(!el)return;el.innerHTML=text?`<div class="msg ${type}">${text}</div>`:"";}
function fmt(v){if(v==null)return"";if(typeof v==="boolean")return v?"Yes":"No";return v;}

document.getElementById("goExternal")&&(document.getElementById("goExternal").onclick=()=>show("externalPage"));
document.getElementById("backWelcomeExt")&&(document.getElementById("backWelcomeExt").onclick=()=>show("welcome"));
document.getElementById("btnExternal")&&(document.getElementById("btnExternal").onclick=async()=>{
  const box=document.getElementById("extMsg");
  try{
    if(!extFirst.value.trim()||!extLast.value.trim()){msg(box,"First name and surname are required.","err");return;}
    const data=await api("/api/External/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      firstName:extFirst.value,lastName:extLast.value,idNumber:extId.value,phone:extPhone.value,email:extEmail.value,address:extAddr.value,
      preferredCallDay:extDay.value||null,preferredCallTime:extTime.value||null
    })});
    msg(box,data.message||"Registration submitted. Admin will contact you within 24 hours.","ok");
  }catch(e){msg(box,e.message,"err");}
});

document.getElementById("goRegisterFromLogin")&&(document.getElementById("goRegisterFromLogin").onclick=()=>show("registerPage"));
document.getElementById("goLogin").onclick=()=>show("loginPage");
document.getElementById("goRegister").onclick=()=>show("registerPage");
document.getElementById("backWelcome1").onclick=()=>show("welcome");
document.getElementById("backWelcome2").onclick=()=>show("welcome");
document.getElementById("btnLogout").onclick=()=>{token="";user=null;localStorage.removeItem("sidsrh_token");localStorage.removeItem("sidsrh_user");show("welcome");};
document.getElementById("btnLogin").onclick=async()=>{
  const box=document.getElementById("loginMsg");
  try{
    const body={
      email:document.getElementById("loginEmail").value.trim(),
      password:document.getElementById("loginPass").value,
      otp:(document.getElementById("loginOtp")&&document.getElementById("loginOtp").value.trim())||null
    };
    const data=await api("/api/Auth/login-mfa",{method:"POST",body:JSON.stringify(body)});
    if(data.mfaRequired){
      const ol=document.getElementById("otpLabel");
      const oi=document.getElementById("loginOtp");
      if(ol){ol.classList.remove("hidden");ol.textContent="Verification code";}
      if(oi){oi.classList.remove("hidden");if(data.verificationCode)oi.value=data.verificationCode;oi.focus();}
      msg(box,"Enter the verification code to complete sign-in."+(data.verificationCode?" Code: "+data.verificationCode:""),"info");
      return;
    }
    token=data.token;
    user=data.user;
    localStorage.setItem("sidsrh_token",token);
    localStorage.setItem("sidsrh_user",JSON.stringify(user));
    openApp();
  }catch(e){msg(box,e.message,"err");}
};

if(document.getElementById("goForgot"))document.getElementById("goForgot").onclick=()=>show("forgotPage");
if(document.getElementById("backLoginFromForgot"))document.getElementById("backLoginFromForgot").onclick=()=>show("loginPage");
if(document.getElementById("btnForgot"))document.getElementById("btnForgot").onclick=async()=>{const box=document.getElementById("forgotMsg");try{const data=await api("/api/Auth/forgot-password",{method:"POST",body:JSON.stringify({email:document.getElementById("forgotEmail").value.trim()})});msg(box,(data.message||"Sent")+(data.verificationCode?" Code: "+data.verificationCode:""),"ok");}catch(e){msg(box,e.message,"err");}};
if(document.getElementById("btnReset"))document.getElementById("btnReset").onclick=async()=>{const box=document.getElementById("forgotMsg");try{await api("/api/Auth/reset-password",{method:"POST",body:JSON.stringify({email:document.getElementById("forgotEmail").value.trim(),code:document.getElementById("forgotOtp").value.trim(),newPassword:document.getElementById("forgotNew").value})});msg(box,"Password updated. Sign in.","ok");}catch(e){msg(box,e.message,"err");}};

document.getElementById("btnRegister").onclick=async()=>{const box=document.getElementById("regMsg");try{await api("/api/Auth/register",{method:"POST",body:JSON.stringify({firstName:document.getElementById("regFirst").value,lastName:document.getElementById("regLast").value,email:document.getElementById("regEmail").value,password:document.getElementById("regPass").value})});msg(box,"Account created. You can sign in now.","ok"); setTimeout(()=>show("loginPage"),1200);}catch(e){msg(box,e.message,"err");}};
function startBackupAutoSync(){
  if(window._backupTimer)return;
  if(!(user&&(user.role==="Administrator")))return;
  window._backupTimer=setInterval(async()=>{
    try{await api("/api/Backup/sync",{method:"POST",body:"{}"});}catch(e){}
  },5*60*1000);
}
function openApp(){window.canSeeDispatch=['Administrator','Manager','Supply Coordinator','Emergency Coordinator','Healthcare Staff','Technician'].includes(user.role);window.canSeeArrival=window.canSeeDispatch||user.role==='Patient';window.isAdmin=user.role==='Administrator';window.isTech=user.role==='Technician';window.isManager=user.role==='Manager';show("app");document.getElementById("userChip").textContent=`${user.firstName} ${user.lastName} - ${user.role}`;const nav=document.getElementById("sideNav");nav.innerHTML="";const items=MENUS[user.role]||MENUS["Patient"];items.forEach(([id,label],i)=>{const b=document.createElement("button");b.textContent=label;b.onclick=()=>{[...nav.children].forEach(x=>x.classList.remove("active"));b.classList.add("active");route(id);};if(i===0)b.classList.add("active");nav.appendChild(b);});route(items[0][0]); startBackupAutoSync();}
async function route(id){const c=document.getElementById("content");document.getElementById("dashTitle").textContent=id;c.innerHTML="Loading…";try{if(id==="dashboard")await viewDashboard(c);else if(id==="drones")await viewDrones(c);else if(id==="deliveries")await viewDeliveries(c);else if(id==="requests")await viewRequests(c);else if(id==="supplies")await viewSupplies(c);else if(id==="staff")await viewStaff(c);else if(id==="clinics")await viewTable(c,"/api/Clinics",["clinicId","clinicName","status","contactNumber"]);else if(id==="equipment")await viewTable(c,"/api/Equipment",["equipmentId","equipmentName","equipmentType","status"]);else if(id==="activity")await viewActivity(c);else if(id==="map")await viewMap(c);else if(id==="dispense")await viewDispense(c);else if(id==="reports")await viewReports(c);else if(id==="patients")await viewPatients(c);
    else if(id==="schedules")await viewSchedules(c);
    else if(id==="weather")await viewWeather(c);
    else if(id==="stations")await viewStations(c);
    else if(id==="appointments")await viewAppointments(c);else if(id==="users")await viewUsers(c);else if(id==="backup")await viewBackup(c);else if(id==="extqueue")await viewExtQueue(c);else if(id==="locations")await viewLocations(c);else if(id==="myreceipt")await viewMyReceipt(c);else c.innerHTML='<div class="panel">Section not available.</div>';}catch(e){c.innerHTML=`<div class="msg err">${e.message}</div>`;}}
async function viewDashboard(c){const d=await api("/api/Dashboard");const role=user.role;let cards="";if(role==="Patient")cards=card(d.deliveriesActive,"Active deliveries")+card(d.requestsOpen,"Open requests");else if(role==="Technician")cards=card(d.dronesAvailable,"Drones available")+card(d.dronesTotal,"Fleet size");else cards=card(d.dronesAvailable,"Drones available")+card(d.deliveriesActive,"Active deliveries")+card(d.requestsOpen,"Open requests")+card(d.supplies,"Supply types")+card(d.staff,"Staff")+card(d.clinics,"Clinics");c.innerHTML=`<div class="cards">${cards}</div><div class="panel"><h3>${role}</h3></div>`;}
function card(n,l){return `<div class="card"><div class="n">${n}</div><div class="l">${l}</div></div>`;}
async function viewTable(c,path,cols){const rows=await api(path);c.innerHTML=`<div class="panel"><table><thead><tr>${cols.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(col=>`<td>${fmt(r[col])}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;}
async function viewDeliveries(c){
  const rows=await api("/api/Deliveries");
  const role=user.role||"";
  const canManage=role==="Administrator"||role==="Manager"||role==="Supply Coordinator"||role==="Emergency Coordinator";
  c.innerHTML=`<div class="panel"><h3>Track deliveries</h3><div id="delMsg"></div>
  <table><thead><tr><th>ID</th><th>Status</th><th>Service</th><th>Km</th><th>Recipient</th><th>Timeline</th><th>Codes</th><th>Actions</th></tr></thead>
  <tbody>${(rows||[]).map(d=>`<tr>
    <td>${d.deliveryId}</td>
    <td><span class="badge">${d.deliveryStatus}</span></td>
    <td>${d.serviceClass||""}</td>
    <td>${d.distanceKm}</td>
    <td>${d.recipientName||""}<br><small>${d.recipientPhone||""}</small></td>
    <td style="font-size:11px">Created: ${(d.dateCreated||"").toString().replace("T"," ").slice(0,16)}<br>
      Left: ${(d.dispatchedAt||"—").toString().replace("T"," ").slice(0,16)}<br>
      ETA: ${(d.estimatedArrival||"—").toString().replace("T"," ").slice(0,16)}<br>
      Done: ${(d.dateCompleted||"—").toString().replace("T"," ").slice(0,16)}</td>
    <td style="font-size:12px">${window.canSeeDispatch||window.isAdmin||canManage?`Dispatch: <b>${d.dispatchCode||"—"}</b><br>`:""}${window.canSeeArrival||window.isAdmin||canManage||role==="Patient"?`Arrival: <b>${d.arrivalCode||"—"}</b>`:""}</td>
    <td>
      ${canManage?`<button class="btn small" onclick="doDispatch('${d.deliveryId}')">Confirm dispatch</button> `:""}
      <button class="btn small ghost" onclick="doArrival('${d.deliveryId}')">Confirm arrival</button>
      ${canManage?`<button class="btn small ghost" onclick="demoArrive('${d.deliveryId}')">Package landed</button> `:""}
      ${(window.isAdmin||role==="Manager"||role==="Administrator")?`<button class="btn small ghost" onclick="forceComplete('${d.deliveryId}')">Manager close</button> `:""}
      <button class="btn small ghost" onclick="openReceipt('${d.deliveryId}')">Receipt</button>
    </td>
  </tr>`).join("")}</tbody></table></div>`;
};
window.demoArrive=async(id)=>{try{await api(`/api/Deliveries/${id}/demo-arrive`,{method:"POST",body:"{}"});route("deliveries");}catch(e){msg(document.getElementById("delMsg"),e.message,"err");}};

async function viewMap(c){
  c.innerHTML=`<div class="panel"><h3>Live map</h3><p style="font-size:12px;color:#556;margin:0 0 8px">Drones update every 2s. In-transit drones move along their route. Click a marker for ID and status.</p><div id="map"></div></div>`;
  if(window._mapTimer){clearInterval(window._mapTimer);window._mapTimer=null;}
  if(mapInst){mapInst.remove();mapInst=null;}
  mapInst=L.map("map").setView([-31.59,28.79],9);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18}).addTo(mapInst);
  const droneLayers={};
  async function refresh(){
    try{
      const data=await api("/api/Map/markers");
      if(!mapInst)return;
      (data.locations||[]).forEach(l=>{
        if(!window._locMarkers)window._locMarkers={};
        if(!window._locMarkers[l.locationId]){
          window._locMarkers[l.locationId]=L.marker([l.latitude,l.longitude]).addTo(mapInst).bindPopup(l.locationName);
        }
      });
      (data.chargingStations||[]).forEach(s=>{
        if(!window._stMarkers)window._stMarkers={};
        if(!window._stMarkers[s.stationId]){
          window._stMarkers[s.stationId]=L.circleMarker([s.latitude,s.longitude],{radius:6,color:"#0d9488",fillColor:"#0d9488",fillOpacity:0.5}).addTo(mapInst).bindPopup(s.stationName+" (charge)");
        }
      });
      (data.drones||[]).forEach(d=>{
        const color=d.status==="In Transit"?"#ea580c":(d.status==="Available"?"#16a34a":"#64748b");
        const html=`<div style="background:${color};color:#fff;border-radius:10px;padding:2px 6px;font-size:11px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:nowrap">${d.droneId||d.droneName}</div>`;
        const icon=L.divIcon({className:"",html,iconSize:[70,22],iconAnchor:[35,11]});
        if(droneLayers[d.droneId]){
          droneLayers[d.droneId].setLatLng([d.latitude,d.longitude]);
          droneLayers[d.droneId].setIcon(icon);
          droneLayers[d.droneId].setPopupContent(`<b>${d.droneName}</b><br>ID: ${d.droneId}<br>${d.status}<br>Battery ${d.batteryLevel}%<br>${d.currentLocation||""}`);
        } else {
          droneLayers[d.droneId]=L.marker([d.latitude,d.longitude],{icon}).addTo(mapInst)
            .bindPopup(`<b>${d.droneName}</b><br>ID: ${d.droneId}<br>${d.status}<br>Battery ${d.batteryLevel}%`);
        }
      });
    }catch(e){console.warn(e);}
  }
  await refresh();
  window._mapTimer=setInterval(refresh,2000);
}

window.mgrReceipt=async function(){
  const q=(document.getElementById("rcptQ")&&document.getElementById("rcptQ").value||"").trim();
  if(!q)return;
  try{
    const rows=await api("/api/Reports/receipt-lookup?name="+encodeURIComponent(q)+"&phone="+encodeURIComponent(q));
    const box=document.getElementById("rcptBox");
    if(!box)return;
    let html="<table><thead><tr><th>Delivery</th><th>Recipient</th><th>Status</th><th></th></tr></thead><tbody>";
    if(rows&&rows.length){
      rows.forEach(function(r){
        html+="<tr><td>"+r.deliveryId+"</td><td>"+(r.recipientName||"")+"</td><td>"+r.deliveryStatus+
          '</td><td><a class="btn small" target="_blank" href="/api/Reports/patient-receipt/'+r.deliveryId+'">Open receipt</a></td></tr>';
      });
    } else html+='<tr><td colspan="4">No matches</td></tr>';
    html+="</tbody></table>";
    box.innerHTML=html;
  }catch(e){alert(e.message);}
};
window.openReceipt=function(id){
  var w=window.open("/api/Reports/patient-receipt/"+encodeURIComponent(id),"_blank");
  if(w){setTimeout(function(){try{w.focus();w.print();}catch(e){}},700);}
};
